<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="BoscGrow Instagram carousel template."
    >

    <title>BoscGrow Instagram Carousel</title>


    <!-- ==============================
         GOOGLE FONTS
    =============================== -->

    <link rel="preconnect" href="https://fonts.googleapis.com">

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap"
        rel="stylesheet"
    >


    <!-- ==============================
         CSS
    =============================== -->

    <link
        rel="stylesheet"
        href="style.css"
    >

</head>


<body>


<!-- =====================================================
     APP
====================================================== -->

<div class="app">


    <!-- =================================================
         INSTAGRAM AREA
    ================================================== -->

    <div class="instagram-wrapper">


        <!-- =============================================
             INSTAGRAM SLIDE
        ============================================== -->

        <article
            class="instagram-slide"
            id="instagramSlide"
        >


            <!-- =========================================
                 DECORATIVE BACKGROUND
            ========================================== -->

            <div class="grid-background"></div>

            <div class="circle circle-one"></div>

            <div class="circle circle-two"></div>


            <!-- =========================================
                 HEADER
            ========================================== -->

            <header class="slide-header">


                <div class="logo">

                    <div class="logo-mark">
                        BG
                    </div>

                    <div class="logo-text">
                        Bosc<span>Grow</span>
                    </div>

                </div>


                <div class="slide-number">

                    <span id="currentNumber">
                        01
                    </span>

                    <span class="number-divider"></span>

                    <span>
                        06
                    </span>

                </div>


            </header>


            <!-- =========================================
                 MAIN CONTENT
            ========================================== -->

            <main class="slide-main">


                <div
                    class="slide-category"
                    id="slideCategory"
                >
                    WELCOME TO BOSCGROW
                </div>


                <h1 id="slideTitle">

                    Welcome to
                    <span>BoscGrow.</span>

                </h1>


                <p
                    class="slide-description"
                    id="slideDescription"
                >
                    Discover ideas, build opportunities,
                    monetize your knowledge and grow your
                    business in the digital world.
                </p>


                <div
                    class="slide-extra"
                    id="slideExtra"
                >
                </div>


            </main>


            <!-- =========================================
                 FOOTER
            ========================================== -->

            <footer class="slide-footer">


                <div class="footer-line"></div>


                <div class="footer-content">

                    <span class="footer-tagline">
                        Discover. Build. Monetize. Right Audiuence. Sell. Grow.
                    </span>

                    <span class="footer-handle">
                        @BoscGrow
                    </span>

                </div>


            </footer>


            <!-- =========================================
                 BACKGROUND SLIDE NUMBER
            ========================================== -->

            <div
                class="background-number"
                id="backgroundNumber"
            >
                01
            </div>


        </article>


    </div>


    <!-- =================================================
         CONTROLS

         IMPORTANT:
         These are completely outside the Instagram image.
    ================================================== -->

    <nav
        class="carousel-controls"
        aria-label="Carousel controls"
    >


        <button
            class="control-button"
            id="previousButton"
            type="button"
            aria-label="Previous slide"
        >
            ←
        </button>


        <div
            class="carousel-dots"
            id="carouselDots"
        >
        </div>


        <button
            class="control-button"
            id="nextButton"
            type="button"
            aria-label="Next slide"
        >
            →
        </button>


    </nav>


</div>


<!-- =====================================================
     JAVASCRIPT
====================================================== -->

<script src="script.js"></script>


</body>

</html>
